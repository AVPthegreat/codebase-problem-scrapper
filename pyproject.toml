[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg"
version = "0.1.0"
description = "Test case generation platform for Codebase Online Judge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Test Case Generator Team" }]
dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.24,<0.29",
    "typer>=0.12,<0.15",
    "pydantic>=2.6,<3.0",
    "sqlmodel>=0.0.14,<0.0.16",
    "python-dotenv>=1.0,<2.0",
    "PyJWT>=2.8,<3.0",
    "rich>=13.6,<14.0",
    "httpx>=0.25,<0.28",
    "aiofiles>=23.2,<24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "coverage>=7.6,<8.0",
    "ruff>=0.6,<0.7",
    "mypy>=1.10,<1.11"
]

[project.scripts]
tcg = "tcg.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
